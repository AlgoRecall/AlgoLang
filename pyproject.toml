[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algolang"
version = "0.7.0"
description = "An executable notation for learning algorithms"
requires-python = ">=3.11"

[project.scripts]
algo = "algolang.cli:main"

[tool.setuptools.packages.find]
include = ["algolang*"]
