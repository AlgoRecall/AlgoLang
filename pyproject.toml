[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algolang"
version = "0.7.0"
description = "An executable notation for learning algorithms"
requires-python = ">=3.11"

[project.scripts]
algo = "algolang.cli:main"

[tool.setuptools.packages.find]
include = ["algolang*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["algolang"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]
